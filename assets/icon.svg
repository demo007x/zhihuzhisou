<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a8cff"/>
      <stop offset="1" stop-color="#0066e0"/>
    </linearGradient>
  </defs>

  <!-- 圆角方底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- 放大镜：镜片（上移，给底部文字留空间） -->
  <circle cx="430" cy="360" r="200" fill="none" stroke="#ffffff" stroke-width="58"/>

  <!-- 放大镜：手柄 -->
  <line x1="578" y1="508" x2="726" y2="656" stroke="#ffffff" stroke-width="72" stroke-linecap="round"/>

  <!-- 镜片内的"智"：四角星 -->
  <path d="M430 252 L454 334 L536 356 L454 378 L430 460 L406 378 L324 356 L406 334 Z" fill="#ffffff"/>

  <!-- 信号点 -->
  <circle cx="782" cy="576" r="30" fill="#ffffff" opacity="0.9"/>
  <circle cx="800" cy="650" r="20" fill="#ffffff" opacity="0.6"/>

  <!-- 品牌文字 -->
  <text x="512" y="878" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="128" font-weight="600" fill="#ffffff" text-anchor="middle">知乎智搜</text>
</svg>
